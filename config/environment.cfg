[production]
log_level = INFO
dashboard_auth = True
dashboard_host = ${DASHBOARD_HOST}
dashboard_port = ${DASHBOARD_PORT}
sqlalchemy_echo = False

[development]
log_level = INFO
dashboard_auth = False
dashboard_host = ${DASHBOARD_HOST}
dashboard_port = ${DASHBOARD_PORT}
sqlalchemy_echo = False

[test]
log_level = ERROR
sqlalchemy_echo = False

test = test
test_int = 42
test_float = 42.5
test_bool = True

[staging]
log_level = INFO
dashboard_host = ${DASHBOARD_HOST}
dashboard_port = ${DASHBOARD_PORT}
sqlalchemy_echo = False
load_only = ["grace_cog", "command_error_handler", "extension_cog"]
